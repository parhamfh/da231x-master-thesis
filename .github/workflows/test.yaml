name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      - run: pip install pipenv
      - run: pipenv sync --dev
      - run: make test
